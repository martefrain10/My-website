<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Postcard back placeholder</title>
  <desc id="desc">A simple blank postcard back with address lines, stamp box, and message area.</desc>
  <rect width="1200" height="900" fill="#f8f4ec"/>
  <rect x="42" y="42" width="1116" height="816" fill="none" stroke="#222" stroke-width="6"/>
  <line x1="600" y1="112" x2="600" y2="788" stroke="#222" stroke-width="4"/>
  <rect x="950" y="106" width="142" height="112" fill="none" stroke="#222" stroke-width="4" stroke-dasharray="14 10"/>
  <g fill="#222" font-family="Courier, monospace" font-size="42" font-weight="700">
    <text x="104" y="134">POSTCARD</text>
    <text x="666" y="302">PLACE</text>
    <text x="666" y="358">STAMP</text>
    <text x="666" y="414">HERE</text>
  </g>
  <g stroke="#222" stroke-width="4">
    <line x1="666" y1="540" x2="1088" y2="540"/>
    <line x1="666" y1="630" x2="1088" y2="630"/>
    <line x1="666" y1="720" x2="1088" y2="720"/>
  </g>
  <g stroke="#222" stroke-width="3" opacity="0.35">
    <line x1="104" y1="260" x2="500" y2="260"/>
    <line x1="104" y1="340" x2="500" y2="340"/>
    <line x1="104" y1="420" x2="500" y2="420"/>
    <line x1="104" y1="500" x2="500" y2="500"/>
    <line x1="104" y1="580" x2="500" y2="580"/>
  </g>
</svg>
